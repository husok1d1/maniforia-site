<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maniforia — 3-Day Free Trial</title>
<meta name="description" content="Maniforia — Design your future. 3-day free trial on App Store and Google Play.">
<meta name="theme-color" content="#f3dbe8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#fbe6e9;
    --bg-2:#f2dae8;
    --bg-3:#e6d4f0;
    --bg-4:#dcd0f2;
    --plum:#3d2550;
    --plum-2:#5b3875;
    --ink:#4a3358;
    --muted:#8a7596;
    --gold-1:#9c7426;
    --gold-2:#c9a24e;
    --gold-3:#e8cf8e;
    --copper:#b98a5e;
    --pill-1:#eba9c8;
    --pill-2:#c9a6dc;
    --glass:rgba(255,255,255,0.52);
    --glass-line:rgba(255,255,255,0.85);
    --mint:#3f9a72;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{
    font-family:'Montserrat',sans-serif;
    color:var(--ink);
    background:linear-gradient(150deg,var(--bg-1) 0%,var(--bg-2) 35%,var(--bg-3) 70%,var(--bg-4) 100%);
    background-attachment:fixed;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  /* soft light orbs */
  .orb{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0;}
  .orb.a{width:340px;height:340px;background:#ffd3df;top:-90px;left:-110px;opacity:.8;}
  .orb.b{width:380px;height:380px;background:#d9c3f3;bottom:-120px;right:-140px;opacity:.75;}
  .orb.c{width:220px;height:220px;background:#fff1d6;top:38%;left:60%;opacity:.55;}
  .sparkles{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .sparkles span{position:absolute;color:var(--gold-2);opacity:0;animation:twinkle 5s ease-in-out infinite;font-size:10px;}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.6);}50%{opacity:.75;transform:scale(1);}}

  main{
    position:relative;z-index:1;
    max-width:420px;margin:0 auto;
    min-height:100vh;
    padding:calc(44px + env(safe-area-inset-top)) 24px calc(36px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;
  }

  /* brand block */
  .logo{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(201,162,78,.35));animation:float 6s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
  .tagline{margin-top:14px;font-size:10.5px;font-weight:600;letter-spacing:4.2px;color:var(--copper);}
  .wordmark{
    margin-top:8px;
    font-family:'Playfair Display',serif;font-weight:500;
    font-size:46px;letter-spacing:5px;line-height:1;
    background:linear-gradient(180deg,#d6b064 0%,#b08532 45%,#8f6a22 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .divider{display:flex;align-items:center;gap:12px;margin:26px 0 22px;width:180px;}
  .divider i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-2),transparent);}
  .divider b{color:var(--gold-2);font-size:11px;font-weight:400;}

  /* offer */
  .eyebrow{
    display:inline-flex;align-items:center;gap:7px;
    padding:7px 16px;border-radius:999px;
    background:rgba(255,255,255,.55);border:1px solid rgba(201,162,78,.35);
    font-size:10.5px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold-1);
  }
  .eyebrow svg{width:13px;height:13px;}
  .headline{
    margin-top:16px;text-align:center;
    font-family:'Montserrat',sans-serif;font-weight:700;
    font-size:32px;line-height:1.15;letter-spacing:-.3px;
  }
  .headline span,.headline em{
    display:block;font-style:normal;font-weight:700;
    background:linear-gradient(180deg,#d6b064 0%,#b08532 50%,#9c7426 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  /* ticket */
  .ticket{
    position:relative;width:100%;margin-top:28px;
    border-radius:26px;
    background:var(--glass);
    backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--glass-line);
    box-shadow:0 24px 50px -18px rgba(91,56,117,.35),inset 0 1px 0 rgba(255,255,255,.9);
    padding:22px 22px 22px;
    text-align:center;
  }
  .ticket::before,.ticket::after{ /* side notches */
    content:"";position:absolute;top:96px;width:22px;height:22px;border-radius:50%;
    background:linear-gradient(150deg,var(--bg-2),var(--bg-3));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.85);
  }
  .ticket::before{left:-11px;}
  .ticket::after{right:-11px;}
  .ticket-label{font-size:10px;font-weight:600;letter-spacing:2.6px;text-transform:uppercase;color:var(--muted);}
  .code{
    margin-top:10px;
    font-family:'Montserrat',sans-serif;font-weight:600;
    font-size:28px;letter-spacing:6px;padding-left:6px;
    background:linear-gradient(180deg,#c9a24e,#8f6a22);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    user-select:all;
  }
  .perf{margin:20px -22px 20px;border-top:1.5px dashed rgba(156,116,38,.28);}

  .copy-btn{
    position:relative;overflow:hidden;
    width:100%;height:56px;border:none;border-radius:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-family:'Montserrat',sans-serif;font-weight:600;font-size:14px;letter-spacing:1.6px;text-transform:uppercase;
    color:#fff;
    background:linear-gradient(135deg,#dcbb72 0%,#b38a36 55%,#9c7426 100%);
    box-shadow:0 14px 28px -10px rgba(156,116,38,.6),inset 0 1px 0 rgba(255,255,255,.4);
    transition:transform .15s ease,background .4s ease,color .4s ease,box-shadow .4s ease;
  }
  .copy-btn:active{transform:scale(.98);}
  .copy-btn svg{width:18px;height:18px;flex-shrink:0;}
  .copy-btn::after{ /* shimmer */
    content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);
    animation:shimmer 3.2s ease-in-out infinite;
  }
  @keyframes shimmer{0%{left:-60%;}55%,100%{left:130%;}}
  .copy-btn .ic-check{display:none;}
  .copied .copy-btn{
    color:var(--gold-1);
    background:rgba(255,255,255,.72);
    box-shadow:inset 0 0 0 1.5px rgba(201,162,78,.6),0 8px 20px -12px rgba(156,116,38,.4);
  }
  .copied .copy-btn::after{display:none;}
  .copied .copy-btn .ic-copy{display:none;}
  .copied .copy-btn .ic-check{display:block;}
  .ticket-note{margin-top:14px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:var(--muted);}

  /* stores */
  .stores{
    width:100%;margin-top:22px;display:grid;gap:12px;grid-template-columns:1fr 1fr;
    transition:opacity .5s ease,filter .5s ease,transform .5s ease;
  }
  .store.dim{opacity:.4;filter:saturate(.35);box-shadow:none;}
  .unlocked .store.dim{animation:none;}
  .unlocked .store.dim::after{display:none;}
  .locked .stores{opacity:.42;filter:saturate(.4);pointer-events:none;}
  .store{
    position:relative;display:flex;align-items:center;justify-content:center;gap:10px;
    height:58px;border-radius:999px;text-decoration:none;color:#fff;
    background:linear-gradient(120deg,var(--pill-1) 0%,var(--pill-2) 100%);
    box-shadow:0 12px 26px -12px rgba(170,110,170,.7),inset 0 1px 0 rgba(255,255,255,.45);
    transition:transform .15s ease,box-shadow .3s ease;
  }
  .store:active{transform:scale(.97);}
  .store svg{width:22px;height:22px;flex-shrink:0;}
  .store svg.apple{width:24px;height:24px;margin-top:-3px;}
  .store svg.play{filter:drop-shadow(0 1px 1.5px rgba(80,40,90,.25));}
  .store .t{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;}
  .store small{font-size:9.5px;font-weight:500;opacity:.92;}
  .store strong{font-size:16px;font-weight:600;letter-spacing:.2px;}
  .unlocked .store{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both;}
  .unlocked .store:nth-child(2){animation-delay:.08s;}
  @keyframes pop{0%{transform:scale(.94);}100%{transform:scale(1);}}
  .unlocked .store::after{
    content:"";position:absolute;inset:-3px;border-radius:999px;
    border:1.5px solid rgba(235,169,200,.7);animation:ring 1.8s ease-out 2;
  }
  @keyframes ring{0%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(1.08);}}
  .hidden{display:none !important;}

  .status{
    margin-top:14px;display:flex;align-items:center;gap:7px;
    font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.2px;
  }
  .status svg{width:13px;height:13px;}
  .unlocked .status{color:var(--mint);}

  footer{margin-top:auto;padding-top:34px;text-align:center;font-size:10.5px;color:var(--muted);line-height:1.7;}
  footer a{color:var(--muted);}

</style>
</head>

      playSmall:"Get it on", playBig:"Google Play",
      locked:"Copy the code to unlock download", unlocked:"Unlocked · head to the store",
      cancel:"Cancel anytime during your trial.", privacy:"Privacy",
      title:"Maniforia — 3-Day Free Trial"
    }
  };

  var qs = new URLSearchParams(location.search);

  function detectLang(){
    var q = qs.get("lang"); if (q === "tr" || q === "en") return q;
    var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""]);
    var tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch(e){}
    var trLang = langs.some(function(l){ return /^tr\b/i.test(l); });
    return (trLang || tz === "Europe/Istanbul") ? "tr" : "en";
  }
  function detectDevice(){
    var q = qs.get("device"); if (q === "ios" || q === "android" || q === "other") return q;
    var ua = navigator.userAgent || "";
    if (/android/i.test(ua)) return "android";
    if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) return "ios";
    return "other";
  }

  var lang = detectLang(), device = detectDevice(), copied = false;
  var $ = function(id){ return document.getElementById(id); };

  function render(){
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent = t[el.getAttribute("data-i18n")]; });
    $("copyText").textContent = copied ? t.copied : t.copy;
    document.querySelector(".ticket-note").textContent = copied ? t.noteDone : t.note;
    $("statusText").textContent = copied ? t.unlocked : t.locked;
    document.querySelector(".ic-lock").classList.toggle("hidden", copied);
    document.querySelector(".ic-open").classList.toggle("hidden", !copied);

    $("ios").href = LINKS[lang].ios; $("android").href = LINKS[lang].play;
    // iOS -> App Store aktif, Android -> Google Play aktif, tanınmazsa ikisi de aktif
    $("ios").classList.toggle("dim", device === "android");
    $("android").classList.toggle("dim", device === "ios");

    document.body.classList.toggle("locked", !copied);
    document.body.classList.toggle("unlocked", copied);
    document.body.classList.toggle("copied", copied);

    document.querySelectorAll("[data-lang]").forEach(function(b){ b.classList.toggle("on", b.dataset.lang === lang); });
    document.querySelectorAll("[data-dev]").forEach(function(b){ b.classList.toggle("on", b.dataset.dev === device); });
  }

  function copyText(txt){
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(txt).catch(fallback);
    }
    return Promise.resolve(fallback());
    function fallback(){
      try {
        var ta = document.createElement("textarea");
        ta.value = txt; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      } catch(e){}
    }
  }

  $("copyBtn").addEventListener("click", function(){
    copyText(CODE).then(function(){
      copied = true;
      try { if (navigator.vibrate) navigator.vibrate(25); } catch(e){}
      render();
    });
  });


  // sparkles
  var sp = $("sparkles");
  for (var i = 0; i < 18; i++) {
    var s = document.createElement("span"); s.textContent = "✦";
    s.style.left = (Math.random()*100) + "%"; s.style.top = (Math.random()*100) + "%";
    s.style.fontSize = (6 + Math.random()*8) + "px";
    s.style.animationDelay = (Math.random()*5) + "s";
    sp.appendChild(s);
  }

  render();
})();
</script>
</body>
</html>
